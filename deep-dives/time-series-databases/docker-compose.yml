services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: tsdb-timescaledb
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: tsdb_demo
    ports:
      - "5432:5432"
    volumes:
      - tsdb_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d tsdb_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: tsdb-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    ports:
      - "3000:3000"
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - grafana_data:/var/lib/grafana

  adminer:
    image: adminer:latest
    container_name: tsdb-adminer
    ports:
      - "8080:8080"
    depends_on:
      - timescaledb
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb

volumes:
  tsdb_data:
  grafana_data:
