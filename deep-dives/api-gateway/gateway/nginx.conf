events {
    worker_connections 1024;
}

http {
    # ==================================================================
    # RATE LIMITING (used in Notebook 2)
    # ==================================================================
    # Creates a shared memory zone that tracks request rates per client IP.
    # - "10m" = 10 megabytes of shared memory (~160,000 unique IPs)
    # - "rate=5r/s" = each IP can make 5 requests per second
    # If a client exceeds this rate, nginx returns HTTP 429 (Too Many Requests).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # ==================================================================
    # API KEY AUTHENTICATION (used in Notebook 2)
    # ==================================================================
    # This "map" checks the X-API-Key header against a list of valid keys.
    # If the header matches a known key → $api_key_valid = 1
    # If not → $api_key_valid = 0 (default)
    map $http_x_api_key $api_key_valid {
        default           0;
        "demo-key-123"    1;
        "premium-key-456" 1;
        "admin-key-789"   1;
    }

    # ==================================================================
    # UPSTREAM BACKENDS (Load Balancing Groups)
    # ==================================================================
    # Two instances of user-service — nginx distributes requests between them.
    # This is "round-robin" load balancing (the default strategy).
    upstream user_backend {
        server user-service-1:5000;
        server user-service-2:5000;
    }

    # Single instance of order-service (no load balancing needed here).
    upstream order_backend {
        server order-service:5000;
    }

    # ==================================================================
    # MAIN SERVER
    # ==================================================================
    server {
        listen 80;
        server_name localhost;

        # --- Gateway Health Check ---
        # A simple endpoint so clients (or monitors) can check if the gateway is alive.
        location = /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # --- Users API (open, with load balancing) ---
        # Requests to /api/users are routed to the user_backend upstream group.
        # nginx automatically load-balances across user-service-1 and user-service-2.
        location /api/users {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            # Gateway injects these headers so the backend knows about the real client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Strip /api prefix: /api/users → /users on the backend
            proxy_pass http://user_backend/users;
        }

        # --- Orders API (open) ---
        location /api/orders {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_pass http://order_backend/orders;
        }

        # --- Authenticated Users API (requires X-API-Key header) ---
        # Same as /api/users but with an authentication check.
        # If the API key is invalid or missing, the gateway returns 401
        # BEFORE the request ever reaches the backend service.
        location /api/auth/users {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized","message":"Valid X-API-Key header required"}';
            }

            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Authenticated "true";

            proxy_pass http://user_backend/users;
        }

        # --- Authenticated Orders API (requires X-API-Key header) ---
        location /api/auth/orders {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized","message":"Valid X-API-Key header required"}';
            }

            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Authenticated "true";

            proxy_pass http://order_backend/orders;
        }

        # --- API v2: Users (version header injection for Notebook 3) ---
        # The gateway injects "X-API-Version: 2" so the backend returns
        # an enriched response — without the client needing to know about it.
        location /api/v2/users {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-API-Version "2";

            # Also add version info to the RESPONSE headers
            add_header X-API-Version "2" always;
            add_header X-Served-By "api-gateway" always;

            proxy_pass http://user_backend/users;
        }

        # --- Debug: See what headers the backend receives ---
        # Useful in Notebook 3 to inspect header injection.
        location /api/debug/headers {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Gateway-Timestamp $msec;

            proxy_pass http://user_backend/debug/headers;
        }

        # --- Catch-all: helpful 404 ---
        location / {
            return 404 '{"error":"Not Found","hint":"Try /api/users, /api/orders, /api/v2/users, or /health"}';
            add_header Content-Type application/json always;
        }
    }
}
