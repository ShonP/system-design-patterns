services:
  # ── EU-West Region (Primary) ─────────────────────────────────
  # Simulates an Azure "West Europe" (Netherlands) Postgres instance.
  # This is where most EU user data lives by default.
  postgres-eu-west:
    image: postgres:16
    container_name: gdpr-eu-west
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: gdpr_eu_west
    ports:
      - "55433:5432"
    volumes:
      - eu_west_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d gdpr_eu_west"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── EU-North Region (Paired) ─────────────────────────────────
  # Simulates an Azure "North Europe" (Ireland) Postgres instance.
  # This is the paired region — data replicates here for disaster recovery.
  postgres-eu-north:
    image: postgres:16
    container_name: gdpr-eu-north
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: gdpr_eu_north
    ports:
      - "55434:5432"
    volumes:
      - eu_north_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d gdpr_eu_north"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Adminer (Database GUI) ───────────────────────────────────
  # Web-based tool to inspect both region databases side-by-side.
  adminer:
    image: adminer:latest
    container_name: gdpr-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres-eu-west
      - postgres-eu-north
    environment:
      ADMINER_DEFAULT_SERVER: postgres-eu-west

volumes:
  eu_west_data:
  eu_north_data:
