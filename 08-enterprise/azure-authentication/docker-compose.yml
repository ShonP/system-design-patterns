services:
  fake-entra:
    build:
      context: .
      dockerfile: fake-entra/Dockerfile
    container_name: azure-auth-entra
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9100/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 10

  api-b:
    build:
      context: .
      dockerfile: api-b/Dockerfile
    container_name: azure-auth-api-b
    ports:
      - "8002:8002"
    environment:
      JWKS_URI: http://fake-entra:9100/contoso/discovery/v2.0/keys
      EXPECTED_ISSUER: http://localhost:9100/contoso/v2.0
      EXPECTED_AUDIENCE: api://api-b
    depends_on:
      fake-entra:
        condition: service_healthy

  api-a:
    build:
      context: .
      dockerfile: api-a/Dockerfile
    container_name: azure-auth-api-a
    ports:
      - "8001:8001"
    environment:
      JWKS_URI: http://fake-entra:9100/contoso/discovery/v2.0/keys
      EXPECTED_ISSUER: http://localhost:9100/contoso/v2.0
      EXPECTED_AUDIENCE: api://api-a
      AUTHORITY_INTERNAL: http://fake-entra:9100
      TENANT_ID: contoso
      API_A_CLIENT_ID: api-a-client-id
      API_A_CLIENT_SECRET: api-a-secret-value
      API_B_BASE_URL: http://api-b:8002
      API_B_IDENTIFIER_URI: api://api-b
    depends_on:
      fake-entra:
        condition: service_healthy
      api-b:
        condition: service_started
