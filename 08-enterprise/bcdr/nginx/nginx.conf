# =============================================================================
# BCDR Lab — Nginx Health Check Dashboard
# =============================================================================
# In a real enterprise setup, a load balancer or monitoring tool constantly
# checks the health of every service. This nginx config provides a simple
# health dashboard that the notebooks can query.
# =============================================================================

server {
    listen 80;
    server_name localhost;

    # Landing page — overview of available health endpoints
    location / {
        default_type text/html;
        return 200 '<!DOCTYPE html>
<html>
<head>
    <title>BCDR Health Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #2c3e50; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; background: #ecf0f1; }
        a { color: #3498db; }
        code { background: #f8f9fa; padding: 2px 6px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>BCDR Lab Health Dashboard</h1>
    <p>This dashboard helps you monitor the health of all services in the BCDR lab.</p>
    <div class="status">
        <h3>Available Endpoints</h3>
        <ul>
            <li><code>GET /health</code> — Dashboard status (this nginx server)</li>
        </ul>
        <h3>Services to Monitor (from notebooks)</h3>
        <ul>
            <li><strong>pg-primary</strong> — PostgreSQL Primary (port 5432)</li>
            <li><strong>pg-standby</strong> — PostgreSQL Standby (port 5433)</li>
            <li><strong>redis-primary</strong> — Redis Primary (port 6379)</li>
            <li><strong>redis-replica</strong> — Redis Replica (port 6380)</li>
        </ul>
    </div>
    <p><em>Use the Jupyter notebooks to run health checks and failover drills.</em></p>
</body>
</html>';
    }

    # JSON health endpoint for programmatic checks
    location /health {
        default_type application/json;
        return 200 '{"service": "nginx-health-dashboard", "status": "running"}';
    }
}
