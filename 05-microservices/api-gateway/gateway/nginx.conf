events {
    worker_connections 1024;
}

http {
    # ==================================================================
    # ACCESS LOGGING (used in Notebook 4 — Observability)
    # ==================================================================
    # A custom log format that includes fields useful for debugging and
    # distributed tracing. Key fields:
    #   $request_id              — unique ID nginx generates per request
    #                              (also injected into the upstream as a header)
    #   $upstream_addr           — which backend instance handled the request
    #   $upstream_status         — status code returned by the backend
    #   $upstream_response_time  — time the backend took to respond
    #   $request_time            — total time including gateway overhead
    #
    # We send logs to /dev/stdout so `docker logs api-gateway` shows them.
    log_format gateway_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_time":$request_time,'
        '"bytes_sent":$bytes_sent,'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /dev/stdout gateway_json;
    error_log  /dev/stderr warn;

    # ==================================================================
    # RATE LIMITING (used in Notebook 2)
    # ==================================================================
    # Creates a shared memory zone that tracks request rates per client IP.
    # - "10m" = 10 megabytes of shared memory (~160,000 unique IPs)
    # - "rate=5r/s" = each IP can make 5 requests per second
    # If a client exceeds this rate, nginx returns HTTP 429 (Too Many Requests).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    # ==================================================================
    # API KEY AUTHENTICATION (used in Notebook 2)
    # ==================================================================
    # This "map" checks the X-API-Key header against a list of valid keys.
    # If the header matches a known key → $api_key_valid = 1
    # If not → $api_key_valid = 0 (default)
    map $http_x_api_key $api_key_valid {
        default           0;
        "demo-key-123"    1;
        "premium-key-456" 1;
        "admin-key-789"   1;
    }

    # ==================================================================
    # UPSTREAM BACKENDS (Load Balancing Groups)
    # ==================================================================
    # Two instances of user-service — nginx distributes requests between them.
    # This is "round-robin" load balancing (the default strategy).
    #
    # max_fails + fail_timeout = "circuit-breaker-style" passive failover
    # (Notebook 4). NOTE: this is *not* a full circuit breaker — it's
    # retry-on-failure + short-term server ejection. True circuit breakers
    # (open/half-open/closed states with metrics) live in tools like
    # Envoy, Istio, Resilience4j, or Hystrix.
    #   max_fails=3     → after 3 failed attempts in fail_timeout window...
    #   fail_timeout=30s → ...mark server as unavailable for 30 seconds.
    upstream user_backend {
        server user-service-1:5000 max_fails=3 fail_timeout=30s;
        server user-service-2:5000 max_fails=3 fail_timeout=30s;
    }

    # Single instance of order-service (no load balancing needed here).
    upstream order_backend {
        server order-service:5000 max_fails=3 fail_timeout=30s;
    }

    # ==================================================================
    # SHARED PROXY DEFAULTS
    # ==================================================================
    # Short timeouts so a slow/dead backend doesn't hang the client.
    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    # Which backend errors should cause nginx to retry the next upstream?
    # This is the "failover" half of our circuit-breaker-style behavior.
    proxy_next_upstream        error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries  2;
    proxy_next_upstream_timeout 5s;

    # ==================================================================
    # MAIN SERVER
    # ==================================================================
    server {
        listen 80;
        server_name localhost;

        # --- Gateway Health Check ---
        # A simple endpoint so clients (or monitors) can check if the gateway is alive.
        location = /health {
            return 200 '{"status":"healthy","service":"api-gateway"}';
            add_header Content-Type application/json;
        }

        # --- Users API (open, with load balancing) ---
        # Requests to /api/users are routed to the user_backend upstream group.
        # nginx automatically load-balances across user-service-1 and user-service-2.
        location /api/users {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            # Gateway injects these headers so the backend knows about the real client
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Strip /api prefix: /api/users → /users on the backend
            proxy_pass http://user_backend/users;
        }

        # --- Orders API (open) ---
        location /api/orders {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_pass http://order_backend/orders;
        }

        # --- Authenticated Users API (requires X-API-Key header) ---
        # Same as /api/users but with an authentication check.
        # If the API key is invalid or missing, the gateway returns 401
        # BEFORE the request ever reaches the backend service.
        location /api/auth/users {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized","message":"Valid X-API-Key header required"}';
            }

            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Authenticated "true";

            proxy_pass http://user_backend/users;
        }

        # --- Authenticated Orders API (requires X-API-Key header) ---
        location /api/auth/orders {
            if ($api_key_valid = 0) {
                return 401 '{"error":"Unauthorized","message":"Valid X-API-Key header required"}';
            }

            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Authenticated "true";

            proxy_pass http://order_backend/orders;
        }

        # --- API v2: Users (version header injection for Notebook 3) ---
        # The gateway injects "X-API-Version: 2" so the backend returns
        # an enriched response — without the client needing to know about it.
        location /api/v2/users {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-API-Version "2";

            # Also add version info to the RESPONSE headers
            add_header X-API-Version "2" always;
            add_header X-Served-By "api-gateway" always;

            proxy_pass http://user_backend/users;
        }

        # --- Debug: See what headers the backend receives ---
        # Useful in Notebook 3 to inspect header injection.
        location /api/debug/headers {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Gateway-Timestamp $msec;

            proxy_pass http://user_backend/debug/headers;
        }

        # ==================================================================
        # NOTEBOOK 4: CORS (Cross-Origin Resource Sharing)
        # ==================================================================
        # Browsers block JavaScript from reading responses that come from a
        # different origin, UNLESS the server explicitly opts in with CORS
        # headers. We show CORS done at the gateway so backends stay simple.
        #
        # How it works:
        #   1. Browser sends an OPTIONS "preflight" request first
        #   2. Gateway replies 204 with Access-Control-Allow-* headers
        #   3. Browser then sends the real request
        #   4. Real response also includes Access-Control-Allow-Origin
        #
        # We use `always` so headers are attached even on 4xx/5xx responses.
        location /api/cors/users {
            # Preflight (OPTIONS) — reply immediately, never hits the backend
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin  "*"                                   always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"    always;
                add_header Access-Control-Allow-Headers "Content-Type, X-API-Key, X-Request-ID" always;
                add_header Access-Control-Max-Age       "3600"                                always;
                add_header Content-Length               0;
                return 204;
            }

            # Real request — forward to backend AND attach CORS headers to response
            add_header Access-Control-Allow-Origin  "*"                                       always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"        always;
            add_header Access-Control-Expose-Headers "X-Request-ID, X-API-Version"           always;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_pass http://user_backend/users;
        }

        # ==================================================================
        # NOTEBOOK 4: REQUEST AGGREGATION / BFF (Backend For Frontend)
        # ==================================================================
        # The gateway routes /api/profile/<id> to the user service, which
        # internally calls the order service and returns a COMBINED payload.
        # The client makes ONE call instead of two — less latency, less code.
        #
        # NOTE: in large systems this composition logic typically lives in a
        # dedicated BFF or GraphQL gateway, not inside a backend service.
        # We keep it in user_service for lab simplicity.
        location ~ ^/api/profile/(?<user_id>[0-9]+)$ {
            limit_req zone=api_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            proxy_pass http://user_backend/profile/$user_id;
        }

        # --- Catch-all: helpful 404 ---
        location / {
            return 404 '{"error":"Not Found","hint":"Try /api/users, /api/orders, /api/v2/users, /api/profile/1, /api/cors/users, or /health"}';
            add_header Content-Type application/json always;
        }
    }

    # ==================================================================
    # NOTEBOOK 4: SSL / TLS TERMINATION  (CONCEPT-ONLY — not runnable)
    # ==================================================================
    # In production, the gateway is almost always where HTTPS ends:
    # clients speak TLS to the gateway, the gateway speaks plain HTTP to
    # internal services. This "SSL termination" pattern means:
    #   - Only ONE place manages certificates
    #   - Backends don't need TLS code or certs
    #   - You can inspect/route/transform the request after decryption
    #
    # A real config would look like the block below. We leave it commented
    # out because this lab doesn't ship with certificates — the goal is
    # to show the shape, not to run HTTPS locally.
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name api.example.com;
    #
    #     # Certificate + private key (obtain from Let's Encrypt, AWS ACM, etc.)
    #     ssl_certificate     /etc/ssl/certs/api.example.com.pem;
    #     ssl_certificate_key /etc/ssl/private/api.example.com.key;
    #
    #     # Modern TLS only — no SSLv3, no TLS 1.0/1.1
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # HSTS tells browsers "always use HTTPS for this domain"
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location /api/users {
    #         proxy_pass http://user_backend/users;   # plain HTTP internally
    #     }
    # }
    #
    # # Redirect any accidental HTTP traffic to HTTPS
    # server {
    #     listen 80;
    #     server_name api.example.com;
    #     return 301 https://$host$request_uri;
    # }
}
