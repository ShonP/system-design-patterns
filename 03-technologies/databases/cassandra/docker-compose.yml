services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    environment:
      CASSANDRA_CLUSTER_NAME: "demo-cluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra-node1"
      # Lower memory for local dev
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    ports:
      - "9042:9042"   # CQL native transport
      - "7000:7000"   # Inter-node communication
    volumes:
      - cassandra_node1_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    environment:
      CASSANDRA_CLUSTER_NAME: "demo-cluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack2"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra-node1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    depends_on:
      cassandra-node1:
        condition: service_healthy
    volumes:
      - cassandra_node2_data:/var/lib/cassandra
    healthcheck:
      # `grep -q '^UN'` is not enough: a node reports one UN line for ITSELF the
      # moment it boots, so the check passed while the ring still had a single
      # member and every QUORUM read failed. Require the node to actually see
      # the peers that should be up by now -- 2 here, 3 on node3 -- so
      # `docker compose up --wait` returns a genuinely formed 3-node ring.
      test: ["CMD-SHELL", "[ \"$$(nodetool status | grep -c '^UN')\" -ge 2 ]"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

  cassandra-node3:
    image: cassandra:4.1
    container_name: cassandra-node3
    environment:
      CASSANDRA_CLUSTER_NAME: "demo-cluster"
      CASSANDRA_DC: "dc1"
      CASSANDRA_RACK: "rack3"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      CASSANDRA_SEEDS: "cassandra-node1"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    depends_on:
      cassandra-node2:
        condition: service_healthy
    volumes:
      - cassandra_node3_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(nodetool status | grep -c '^UN')\" -ge 3 ]"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s

volumes:
  cassandra_node1_data:
  cassandra_node2_data:
  cassandra_node3_data:
