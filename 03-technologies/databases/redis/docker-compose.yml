services:
  # ── Standalone Redis (used by most notebooks) ──────────────────────────
  redis:
    image: redis:7
    container_name: redis-deep-dive
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Master (for Sentinel / replication demos) ────────────────────
  redis-master:
    image: redis:7
    container_name: redis-master
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Replicas ─────────────────────────────────────────────────────
  redis-replica-1:
    image: redis:7
    container_name: redis-replica-1
    command: redis-server --replicaof redis-master 6379
    ports:
      - "6381:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-replica-2:
    image: redis:7
    container_name: redis-replica-2
    command: redis-server --replicaof redis-master 6379
    ports:
      - "6382:6379"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis Sentinels (quorum = 2 out of 3) ──────────────────────────────
  sentinel-1:
    image: redis:7
    container_name: redis-sentinel-1
    command: >
      sh -c '
      echo "port 26379" > /tmp/sentinel.conf && echo "sentinel resolve-hostnames yes" >> /tmp/sentinel.conf && echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf &&
      echo "sentinel monitor mymaster redis-master 6379 2" >> /tmp/sentinel.conf &&
      echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf &&
      echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf &&
      echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26379:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  sentinel-2:
    image: redis:7
    container_name: redis-sentinel-2
    command: >
      sh -c '
      echo "port 26379" > /tmp/sentinel.conf && echo "sentinel resolve-hostnames yes" >> /tmp/sentinel.conf && echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf &&
      echo "sentinel monitor mymaster redis-master 6379 2" >> /tmp/sentinel.conf &&
      echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf &&
      echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf &&
      echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26380:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  sentinel-3:
    image: redis:7
    container_name: redis-sentinel-3
    command: >
      sh -c '
      echo "port 26379" > /tmp/sentinel.conf && echo "sentinel resolve-hostnames yes" >> /tmp/sentinel.conf && echo "sentinel announce-hostnames yes" >> /tmp/sentinel.conf &&
      echo "sentinel monitor mymaster redis-master 6379 2" >> /tmp/sentinel.conf &&
      echo "sentinel down-after-milliseconds mymaster 5000" >> /tmp/sentinel.conf &&
      echo "sentinel failover-timeout mymaster 10000" >> /tmp/sentinel.conf &&
      echo "sentinel parallel-syncs mymaster 1" >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf'
    ports:
      - "26381:26379"
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # ── RedisInsight (GUI for exploring Redis) ─────────────────────────────
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redis-deep-dive-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis
      - redis-master
