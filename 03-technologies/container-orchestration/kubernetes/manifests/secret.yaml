# A Secret is NOT encrypted. Kubernetes base64-encodes the values on the way in
# and etcd stores them as-is unless the cluster administrator has explicitly
# enabled EncryptionConfiguration (encryption at rest) on the API server.
# `kubectl get secret db-credentials -o yaml | base64 -d` reverses it in one step,
# and anyone with `get secrets` RBAC in this namespace can do exactly that.
#
# `stringData` below is a convenience: you write plaintext, the API server
# base64-encodes it into `data` for you. It changes nothing about the security.
#
# Treat this file as a teaching example. Real credentials belong in an external
# secret store (Vault / AWS Secrets Manager / Azure Key Vault) synced in by the
# External Secrets Operator -- see notebook 09.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: k8s-lab
type: Opaque
stringData:
  DB_HOST: "postgres.k8s-lab.svc.cluster.local"
  DB_PORT: "5432"
  DB_USER: "app_user"
  DB_PASSWORD: "change-me-in-production"
  DB_NAME: "k8s_lab"
