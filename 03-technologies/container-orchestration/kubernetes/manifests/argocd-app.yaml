apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-lab-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/k8s-lab-gitops.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
