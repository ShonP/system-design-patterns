apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: k8s-lab
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    # The port NAME matters: a Prometheus ServiceMonitor's `endpoints[].port`
    # is the *name* of a Service port, not a number. Unnamed ports cannot be
    # selected by a ServiceMonitor at all (notebook 05 depends on this).
    - name: http
      port: 8000        # the port the Service answers on
      targetPort: 8000  # the containerPort traffic is forwarded to
      nodePort: 30080   # NodePort only: the port opened on every node
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: k8s-lab
  labels:
    app: user-service
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: k8s-lab
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
