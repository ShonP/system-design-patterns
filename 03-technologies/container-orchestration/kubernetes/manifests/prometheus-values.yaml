# Helm values for kube-prometheus-stack in minikube
# Install: helm install prometheus prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f prometheus-values.yaml
#
# These numbers are deliberately smaller than the chart's defaults. On a 6 GB
# single-node cluster that also has to hold Istio (notebook 08) and a sidecar per
# pod, the stock values are the difference between "tight" and "the node stops
# responding". Two of them matter more than the resource limits:
#
#   retention: 2h        -- the TSDB is the busiest writer in the cluster, and on
#                           minikube's hostPath storage that write amplification
#                           is what actually hurts. Two hours is plenty for a lab
#                           and cuts both disk and page cache substantially.
#   defaultRules.create  -- the chart ships ~100 recording and alerting rules that
#                           are re-evaluated every 30s. Notebook 05 writes its own
#                           PrometheusRule, so nothing here needs them.
#
# Turn them back up if you want the full production-shaped install and have the
# memory for it.

prometheus:
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 800Mi
    retention: 2h
    walCompression: true
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

grafana:
  adminPassword: admin
  service:
    type: NodePort
    nodePort: 30300
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# Notebook 05 creates the only alert rules this lab needs. The chart's ~100
# built-in rules are pure overhead here, and several of them fire constantly on a
# single-node cluster (no etcd HA, no scheduler metrics), which is noise that
# teaches nothing.
defaultRules:
  create: false
