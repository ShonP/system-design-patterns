# ---------------------------------------------------------------------------
# RBAC reference for the k8s-lab namespace.
#
# Role vs ClusterRole:        WHAT permissions are described.
# RoleBinding vs ClusterRoleBinding: WHERE those permissions apply.
#
#   Role        + RoleBinding        -> permissions in ONE namespace.
#   ClusterRole + ClusterRoleBinding -> permissions in EVERY namespace, plus
#                                        cluster-scoped objects (nodes, PVs,
#                                        namespaces, CRDs).
#   ClusterRole + RoleBinding        -> the useful subtle one: the ClusterRole's
#                                        rules are applied but SCOPED DOWN to the
#                                        RoleBinding's namespace. This is how you
#                                        reuse one shared role definition (e.g.
#                                        the built-in `view` or `edit`) across
#                                        many teams without granting anything
#                                        cluster-wide. Cluster-scoped resources
#                                        in that ClusterRole simply do not apply.
#   Role        + ClusterRoleBinding -> INVALID. A ClusterRoleBinding's roleRef
#                                        must be a ClusterRole; the API server
#                                        rejects it.
#
# roleRef is immutable. To point a binding at a different role you must delete
# and recreate the binding.
# ---------------------------------------------------------------------------

# ServiceAccount for application workloads.
# automountServiceAccountToken: false means pods using this SA get NO API
# credentials mounted at /var/run/secrets/kubernetes.io/serviceaccount. That is
# the right default for an app that never calls the Kubernetes API -- an app that
# does need to call it must set `automountServiceAccountToken: true` on the pod
# spec, otherwise the Role below grants permissions it can never present a token
# to use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: k8s-lab
automountServiceAccountToken: false
---
# Role: read-only access to pods and services in k8s-lab namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-reader
  namespace: k8s-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
# RoleBinding: bind app-reader role to app-service-account
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-reader-binding
  namespace: k8s-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: app-reader
subjects:
  - kind: ServiceAccount
    name: app-service-account
    namespace: k8s-lab
---
# Role: developer access (can manage deployments, but not secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer
  namespace: k8s-lab
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
# RoleBinding: bind developer role to a user
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: developer-binding
  namespace: k8s-lab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: developer
subjects:
  - kind: User
    name: developer@example.com
    apiGroup: rbac.authorization.k8s.io
