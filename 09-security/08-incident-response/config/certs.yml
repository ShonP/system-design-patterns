# Node list for wazuh-certs-generator. The names MUST match the compose service
# hostnames, because the certificates' CN/SAN are what filebeat and the indexer verify.
nodes:
  indexer:
    - name: wazuh.indexer
      ip: wazuh.indexer
  server:
    - name: wazuh.manager
      ip: wazuh.manager
  dashboard:
    - name: wazuh.dashboard
      ip: wazuh.dashboard
