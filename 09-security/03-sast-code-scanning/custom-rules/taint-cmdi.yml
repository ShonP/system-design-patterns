rules:
  - id: cmdi-from-request
    message: |
      User-controlled data reaches os.system / subprocess.* with shell=True — command injection.
      Use subprocess.run([...]) with a list and no shell.
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.form[...]
      - pattern: request.json[...]
    # Without sanitizers a taint rule reports every flow, including the ones
    # that were already made safe -- i.e. it manufactures false positives.
    # Anything listed here stops the taint at that point.
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: int(...)
      - pattern: re.fullmatch(...)
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: subprocess.$F($X, ..., shell=True)
      - patterns:
          - pattern: subprocess.$F($X)
          - metavariable-pattern:
              metavariable: $X
              pattern: "$_ + $_"
