# Exercise 9: a hardening reverse proxy in front of Juice Shop.
# It fixes exactly the class of finding a ZAP *baseline* (passive) scan reports:
# missing response headers. It fixes none of the injection or access-control bugs,
# which is the point -- headers are the cheap half.
server {
    listen 80;
    server_name _;

    # "always" makes nginx emit the header on error responses too (4xx/5xx), which is
    # where scanners and attackers spend most of their time.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options            "nosniff" always;
    add_header X-Frame-Options                   "DENY" always;
    add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy                "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy        "same-origin" always;
    add_header Cross-Origin-Resource-Policy      "same-origin" always;

    # Deliberately absent: Strict-Transport-Security. HSTS is ignored by browsers over
    # plain HTTP and ZAP will (correctly) flag it as pointless here. The fix for that
    # finding is TLS, not another header -- which is a fix this lab cannot make.

    server_tokens off;

    location / {
        proxy_pass         http://juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;   # Juice Shop uses socket.io
        proxy_set_header   Connection        "upgrade";
    }
}
