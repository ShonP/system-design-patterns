apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata:
      labels: { app: web }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.29-alpine
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          livenessProbe:
            httpGet: { path: /, port: 8080 }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          volumeMounts:
            # readOnlyRootFilesystem means every path nginx writes to needs a
            # volume. nginx-unprivileged puts *all* of its temp paths under /tmp
            # (proxy_temp, client_temp, fastcgi_temp, ...); miss that one and the
            # container CrashLoopBackOffs with
            #   [emerg] mkdir() "/tmp/proxy_temp" failed (30: Read-only file system)
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: pid,   mountPath: /var/run }
            - { name: tmp,   mountPath: /tmp }
      volumes:
        - { name: cache, emptyDir: {} }
        - { name: pid,   emptyDir: {} }
        - { name: tmp,   emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports: [{ port: 80, targetPort: 8080 }]
