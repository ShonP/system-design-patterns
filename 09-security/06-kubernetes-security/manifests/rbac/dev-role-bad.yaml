apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: dev-too-much }
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs:     ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: dev-too-much }
subjects:
  - { kind: User, name: jane@example.com, apiGroup: rbac.authorization.k8s.io }
roleRef:
  kind: ClusterRole
  name: dev-too-much
  apiGroup: rbac.authorization.k8s.io
