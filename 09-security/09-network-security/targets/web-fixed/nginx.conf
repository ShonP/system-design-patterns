# Exercise 9: the same web target, remediated.
#  - current nginx (the 1.18.0 banner is what nuclei / --script vulners fingerprinted)
#  - server_tokens off, so the version is not advertised at all
#  - /admin is not served
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;

    location /admin {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
