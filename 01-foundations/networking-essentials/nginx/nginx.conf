events {
    worker_connections 1024;
}

http {
    # ──────────────────────────────────────────────
    # Upstream groups — each uses a different algorithm
    # ──────────────────────────────────────────────

    # Round-robin (default): requests go 1 → 2 → 3 → 1 → ...
    upstream backends_roundrobin {
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
    }

    # Least connections: request goes to the server with fewest active connections
    upstream backends_leastconn {
        least_conn;
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
    }

    # IP hash: same client IP always hits the same server (sticky sessions)
    upstream backends_iphash {
        ip_hash;
        server backend1:5000;
        server backend2:5000;
        server backend3:5000;
    }

    # Weighted: backend1 gets 3× the traffic of backend2 and backend3
    upstream backends_weighted {
        server backend1:5000 weight=3;
        server backend2:5000 weight=1;
        server backend3:5000 weight=1;
    }

    # ──────────────────────────────────────────────
    # HTTP server (port 80)
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Default: round-robin load balancing
        location / {
            proxy_pass http://backends_roundrobin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Load-Balancer "nginx-roundrobin";
        }

        # Least connections
        location /least-conn/ {
            proxy_pass http://backends_leastconn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Load-Balancer "nginx-leastconn";
        }

        # IP hash (sticky sessions)
        location /ip-hash/ {
            proxy_pass http://backends_iphash/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Load-Balancer "nginx-iphash";
        }

        # Weighted round-robin
        location /weighted/ {
            proxy_pass http://backends_weighted/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Load-Balancer "nginx-weighted";
        }

        # Simple nginx health check
        location /nginx-health {
            return 200 'nginx is healthy\n';
            add_header Content-Type text/plain;
        }
    }

    # ──────────────────────────────────────────────
    # HTTPS server (port 443) — used by TLS notebook
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backends_roundrobin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # ──────────────────────────────────────────────
    # mTLS server (port 8443) — requires client certificate
    # ──────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Require clients to present a certificate signed by our CA
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client on;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backends_roundrobin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
            proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        }
    }
}
