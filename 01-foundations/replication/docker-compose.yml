services:
  primary:
    image: postgres:16
    container_name: replication-primary
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: replication_demo
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
      - ./db/primary/init.sh:/docker-entrypoint-initdb.d/init.sh
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d replication_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  replica:
    image: postgres:16
    container_name: replication-replica
    depends_on:
      primary:
        condition: service_healthy
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: replication_demo
    ports:
      - "55433:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
      - ./db/replica/setup.sh:/usr/local/bin/setup.sh:ro
    entrypoint: ["bash", "/usr/local/bin/setup.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer:latest
    container_name: replication-adminer
    ports:
      - "8080:8080"
    depends_on:
      - primary
    environment:
      ADMINER_DEFAULT_SERVER: primary

volumes:
  primary_data:
  replica_data:
