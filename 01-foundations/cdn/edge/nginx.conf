worker_processes 1;

events { worker_connections 1024; }

http {
    # ------------------------------------------------------------------
    # proxy_cache_path defines WHERE nginx keeps cached copies of upstream
    # responses on disk. This is the "edge cache" in our CDN analogy.
    #   levels=1:2        -> directory structure (performance detail)
    #   keys_zone=edge:10m-> shared memory zone for cache keys (10 MB)
    #   max_size=100m     -> cap total on-disk cache at 100 MB
    #   inactive=60m      -> drop entries not accessed for 60 minutes
    # ------------------------------------------------------------------
    proxy_cache_path /var/cache/nginx/edge levels=1:2 keys_zone=edge:10m
                     max_size=100m inactive=60m use_temp_path=off;

    # Expose the cache status ($upstream_cache_status can be MISS, HIT,
    # EXPIRED, BYPASS, STALE, UPDATING, REVALIDATED) as a response header
    # so notebooks can inspect it.
    map $upstream_cache_status $cache_status { default $upstream_cache_status; "" "NONE"; }

    upstream origin_upstream {
        # "origin" is the docker-compose service name.
        server origin:8000;
    }

    server {
        listen 80;

        # $hostname resolves to the container's hostname (edge1, edge2, ...)
        # so clients can tell which edge POP served them.
        add_header X-Edge-Server $hostname always;
        add_header X-Cache-Status $cache_status always;

        location /health {
            access_log off;
            return 200 "edge ok\n";
        }

        # Expose the on-disk cache directory listing for teaching purposes.
        # Not something you'd do in production!
        location = /_cache_keys {
            default_type text/plain;
            alias /var/cache/nginx/edge/;
            autoindex on;
        }

        # --- Push CDN zone ---------------------------------------------
        # Files placed into /usr/share/nginx/pushed (volume-mounted from
        # the host) are served *directly* by this edge — no origin call,
        # no cache lookup. This mimics a "push CDN" where the content
        # provider uploads assets straight to the edge ahead of time.
        location /pushed/ {
            alias /usr/share/nginx/pushed/;
            add_header X-Edge-Server $hostname always;
            add_header X-Cache-Status "PUSHED" always;
            autoindex on;
        }

        location / {
            proxy_pass http://origin_upstream;
            proxy_cache edge;

            # Cache successful + redirect responses for 1 minute by default,
            # but the origin's Cache-Control header wins when present.
            proxy_cache_valid 200 302 1m;
            proxy_cache_valid 404 10s;

            # Use the URL path as the cache key (simple + predictable).
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # Serve stale content if the origin is down or slow — a classic
            # CDN resilience feature.
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Coalesce simultaneous misses into a single upstream request
            # (prevents thundering herd / cache stampede on a cold key).
            proxy_cache_lock on;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
