services:
  fake-entra:
    build:
      context: ../../../enterprise-patterns/azure-authentication
      dockerfile: fake-entra/Dockerfile
    container_name: az500-entra
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9000/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 10

  api-b:
    build:
      context: ../../../enterprise-patterns/azure-authentication
      dockerfile: api-b/Dockerfile
    container_name: az500-api-b
    ports:
      - "8002:8002"
    environment:
      JWKS_URI: http://fake-entra:9000/contoso/discovery/v2.0/keys
      EXPECTED_ISSUER: http://localhost:9000/contoso/v2.0
      EXPECTED_AUDIENCE: api://api-b
    depends_on:
      fake-entra:
        condition: service_healthy
