services:
  postgres:
    image: postgres:16
    container_name: leetcode-postgres
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: leetcode_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d leetcode_demo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: leetcode-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Lightweight sandbox container for simulating isolated code execution.
  # In production, you would spin up short-lived containers per submission.
  # Here we keep one running so notebooks can docker-exec into it.
  sandbox:
    image: python:3.12-slim
    container_name: leetcode-sandbox
    command: ["sleep", "infinity"]
    # Security constraints that mirror a real sandbox
    read_only: true
    tmpfs:
      - /tmp:size=64m
    mem_limit: 256m
    cpus: 0.5
    network_mode: "none"            # no network access
    security_opt:
      - no-new-privileges:true

  adminer:
    image: adminer:latest
    container_name: leetcode-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

  redisinsight:
    image: redis/redisinsight:latest
    container_name: leetcode-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
