services:
  # Tiny mock of Microsoft Entra ID (the real "login.microsoftonline.com"). It speaks
  # just enough OAuth2 / OpenID Connect for the notebooks to demonstrate tokens,
  # scopes and app roles without needing an Azure subscription.
  fake-entra:
    build:
      context: ../../../08-enterprise/azure-authentication
      dockerfile: fake-entra/Dockerfile
    container_name: az500-entra
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9100/health\")'"]
      interval: 3s
      timeout: 3s
      retries: 10

  # A pretend protected API that validates the JWTs issued by fake-entra.
  api-b:
    build:
      context: ../../../08-enterprise/azure-authentication
      dockerfile: api-b/Dockerfile
    container_name: az500-api-b
    ports:
      - "8002:8002"
    environment:
      JWKS_URI: http://fake-entra:9100/contoso/discovery/v2.0/keys
      EXPECTED_ISSUER: http://localhost:9100/contoso/v2.0
      EXPECTED_AUDIENCE: api://api-b
    depends_on:
      fake-entra:
        condition: service_healthy
